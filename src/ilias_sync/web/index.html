<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>ILIAS Sync</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23007aff'/%3E%3Cpath d='M16 7 5 12.5 16 18l11-5.5Z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M9.5 15v5c0 2 3 4 6.5 4s6.5-2 6.5-4v-5' fill='none' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#view">Zum Inhalt springen</a>

    <div id="boot" class="boot" role="status">
      <div class="boot-spinner" aria-hidden="true"></div>
      <p id="boot-message">ILIAS Sync wird gestartet …</p>
      <noscript>Für diese Oberfläche wird JavaScript benötigt.</noscript>
    </div>

    <div id="app" class="app" hidden>
      <aside class="sidebar" aria-label="Seitenleiste">
        <div class="brand">
          <span class="brand-logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 3 8l9 4.5L21 8Z"/><path d="M6.5 10v4.2c0 1.6 2.5 3.3 5.5 3.3s5.5-1.7 5.5-3.3V10"/></svg>
          </span>
          <span class="brand-name">ILIAS Sync</span>
          <span id="mock-badge" class="badge badge-mock" hidden>Demo</span>
        </div>
        <nav id="nav" class="nav" aria-label="Hauptnavigation"></nav>
        <div class="sidebar-foot">
          <span id="conn-indicator" class="conn" data-state="connecting" title="Verbinde …">
            <span class="conn-dot" aria-hidden="true"></span><span class="conn-text">Verbinde …</span>
          </span>
        </div>
      </aside>

      <main id="view" class="view" tabindex="-1"></main>
    </div>

    <div id="offline-banner" class="offline-banner" role="alert" hidden>
      <span>Keine Verbindung zum ILIAS-Sync-Dienst. Neuer Versuch läuft automatisch …</span>
      <button type="button" id="offline-retry" class="btn btn-secondary btn-sm">Jetzt erneut versuchen</button>
    </div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <div id="announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
