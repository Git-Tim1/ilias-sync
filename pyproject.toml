[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ilias-sync"
dynamic = ["version"]
description = "Lokale Synchronisierung von ILIAS-Kursmaterialien"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "playwright", "beautifulsoup4", "requests", "PyYAML", "python-slugify",
  "platformdirs", "keyring", "fastapi", "uvicorn", "tqdm", "typing_extensions",
]

[project.optional-dependencies]
desktop = ["pywebview>=5"]
dev = ["pytest", "httpx2", "ruff"]

packaging = ["pyinstaller>=6.12", "build", "dmgbuild; sys_platform == 'darwin'"]

[project.scripts]
ilias-sync = "ilias_sync.cli:main"
ilias-sync-desktop = "ilias_sync.desktop:main"

[tool.hatch.version]
path = "src/ilias_sync/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ilias_sync"]

[tool.ruff]
exclude = ["legacy"]
