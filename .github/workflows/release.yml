name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, target: macOS-arm64, extras: '.[desktop,packaging]'}
          - {os: macos-15-intel, target: macOS-x86_64, extras: '.[desktop,packaging]'}
          - {os: windows-2022, target: Windows-x86_64, extras: '.[desktop,packaging]'}
          - {os: ubuntu-22.04, target: Linux-x86_64, extras: '.[packaging]'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install "${{ matrix.extras }}"
      - name: Build macOS disk image
        if: runner.os == 'macOS'
        run: PYTHON=python bash packaging/build_macos.sh
      - name: Build Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = python -c 'from ilias_sync import __version__; print(__version__)'
          python -m PyInstaller --noconfirm --clean packaging/ilias-sync.spec
          # Start-Process waits for the GUI-capable bootloader and exposes its exit code.
          $binary = 'dist/ilias-sync/ilias-sync.exe'
          foreach ($arguments in @('--help', 'browser status')) {
            $result = Start-Process $binary -ArgumentList $arguments -Wait -PassThru -NoNewWindow
            if ($result.ExitCode -ne 0) { exit $result.ExitCode }
          }
          Compress-Archive -Path dist/ilias-sync -DestinationPath "dist/ILIAS-Sync-$version-Windows-x86_64.zip"
      - name: Build Linux tarball
        if: runner.os == 'Linux'
        run: |
          version="$(python -c 'from ilias_sync import __version__; print(__version__)')"
          python -m PyInstaller --noconfirm --clean packaging/ilias-sync.spec
          dist/ilias-sync/ilias-sync --help
          dist/ilias-sync/ilias-sync browser status
          tar -C dist -czf "dist/ILIAS-Sync-$version-Linux-x86_64.tar.gz" ilias-sync
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: dist/ILIAS-Sync-*
          if-no-files-found: error

  python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install '.[packaging]'
      - name: Check release version
        if: github.event_name == 'push'
        run: test "$GITHUB_REF_NAME" = "v$(python -c 'from ilias_sync import __version__; print(__version__)')"
      - run: python -m build
      - uses: actions/upload-artifact@v6
        with:
          name: release-python
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, python]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
